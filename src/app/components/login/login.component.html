<section id="login-section">
  <div class="scanlines"></div>

  <div class="login-container">

    <div class="play-title" data-splitting>Portafolio Backend</div>

    <div class="card-login">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" id="login-form">

        <div class="input-group">
          <label for="username">Usuario</label>
          <input type="text" formControlName="username" />
        </div>

        <div class="input-group">
          <label for="password">Contraseña</label>
          <input type="password" formControlName="password" />
        </div>


        <div class="error-message" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>

        <button color="primary" type="submit" [disabled]="!loginForm.valid" class="login-button">
          Ingresar
        </button>
      </form>
    </div>

    <button class="recordSpeed-button">¿Cómo ingresar?</button>
  </div>
</section>
